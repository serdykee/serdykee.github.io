<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💌 Tâm thư gửi em!</title>
<style>
body {
  margin: 0; height: 100vh;
  background: radial-gradient(circle at 10% 10%, #2a2a72 0%, #1f1c2c 35%, #111 100%);
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  color: #fff;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Tim bay nền */
.hearts {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: -1;
}
.hearts i {
  position: absolute;
  width: 16px; height: 16px;
  transform: rotate(45deg);
  background: linear-gradient(135deg,#ff6b9f,#ffd1dc);
  opacity: 0.12;
  animation: floatUp var(--dur) linear infinite;
}
.hearts i:before, .hearts i:after {
  content: "";
  position: absolute;
  width: 16px; height: 16px;
  background: inherit;
  border-radius: 50%;
}
.hearts i:before { left: -8px; }
.hearts i:after { top: -8px; }
@keyframes floatUp {
  0% { transform: translateY(10vh) rotate(45deg) scale(0.8); }
  100% { transform: translateY(-110vh) rotate(45deg) scale(1.1); }
}

/* Phong bì 3D */
.envelope-container {
  width: 280px; height: 180px;
  perspective: 1200px;
  cursor: pointer;
  position: relative;
  z-index: 2;
}
.envelope {
  width: 100%; height: 100%;
  background: #ffdde1;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  overflow: hidden;
  transition: transform 1s ease;
}
.envelope-lid {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #ffb6c9;
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform 1.5s cubic-bezier(0.42,0,0.12,1.4), opacity 1.5s ease;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  z-index: 2;
}
.envelope.open .envelope-lid {
  transform: rotateX(-150deg);
  opacity: 0;
}

/* Card thư */
.serdykee-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(620px, 90vw);
  min-height: 260px;
  padding: 28px;
  border-radius: 22px;
  background: rgb(164 0 68 / 16%);
  border: 1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(4px) saturate(150%);
  -webkit-backdrop-filter: blur(4px) saturate(150%);
  text-align: center;
  font-size: 1.1rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s ease;
  box-shadow: 0 0 0 rgba(255,192,203,0);
}
.serdykee-glow.flash {
  opacity: 1;
  pointer-events: auto;
  animation: glowOutside 3s ease-out forwards;
}
@keyframes glowOutside {
  0% { box-shadow: 0 0 0 rgba(255,255,255,0), 0 0 0 rgba(255,192,203,0); }
  50% { box-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 25px rgba(255,192,203,0.6); }
  100% { box-shadow: 0 0 0 rgba(255,255,255,0), 0 0 0 rgba(255,192,203,0); }
}

/* Hiệu ứng gõ chữ */
  .typing{ white-space:pre-wrap; text-indent: 2em; font-size: clamp(16px, 3.6vw, 18px); line-height:1.6; min-height:4.4em; color:#f2f6ff; text-align: justify; }
  .cursor {
  display: inline-block;
  width: 10px;                 /* gạch đứng mảnh */
  line-height: 1em;
  height: 1.2em;                /* cao bằng chữ */
  margin-left: 1px;
  vertical-align: text-bottom; /* canh theo chân chữ */
  border-left: 2px solid currentColor;
  animation: blink 1s steps(1) infinite;
}
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }




</style>
</head>
<body>

<div class="envelope-container" id="envelopeBox">
  <div class="envelope" id="envelope">
    <div class="envelope-lid"></div>
  </div>
</div>

<section class="serdykee-glow" id="serdyContent">
<h2 style="text-align: left; padding-left: 1.4em;">Gửi người anh thương ... ! 💖💖</h2>
  <p id="typeTarget" class="typing"></p>
</section>

<div class="hearts"></div>

<script>
// Tim bay
(function seedHearts(){
  const ctn = document.querySelector('.hearts');
  const N = 40;
  for(let i=0;i<N;i++){
    const h=document.createElement('i');
    h.style.left=Math.random()*100+'vw';
    h.style.bottom=(-10+Math.random()*20)+'vh';
    h.style.setProperty('--dur',(12+Math.random()*12)+'s');
    h.style.animationDelay=(Math.random()*-20)+'s';
    ctn.appendChild(h);
  }
})();

// Mở phong bì
const envelope = document.getElementById("envelope");
const box = document.getElementById("envelopeBox");
const card = document.getElementById("serdyContent");
const typeTarget = document.getElementById('typeTarget');

box.onclick = () => {
  envelope.classList.add("open");
  setTimeout(() => { box.style.opacity = "0"; }, 1500);
  setTimeout(() => { 
    box.style.display = "none"; 
    card.classList.add("flash"); 
 // delay 2 giây trước khi gõ chữ
    setTimeout(() => startTyping(), 2000); // bắt đầu gõ chữ sau khi mở thư
  }, 1700);
};

// Hiệu ứng gõ chữ
const sequence = [
   {text: "Ngọc Hà yêu dấu !", pause: 2200},
      {text: "\nAnh vốn dĩ không phải là một người hoàn hỏaoo...", pause: 700},{delete: 8, pause: 500},
      {text: "hảo,", pause: 1250},
      {text: " anh vẫn đầy những khuyết điểm và những thiếu soots !", pause: 1200},{delete: 7, pause: 200},
      {text: "sót, ", pause: 500},
      {text: "chẳng phải lúc nào cũng dịu dàng trước em. ", pause: 4200},
      {text: "Mỗi một ngày anh đều cố gắng dành cho em thứ tình yêu mà em xứng đáng được nhận, cho em thứ cảm giác an toàn nhiều hơn, cùng nhau trải qua những ngày tồi tệ, để tìm được những ngày bình yên, như lúc này. ", pause: 4200},
      {text: "\nAnh từng nghĩ mình sẽ", pause: 1200},
	{delete: 7, pause: 300},
      {text: "trái tim mình sẽ chẳng thể rung động lại nữa...", pause: 2200},
      {delete: 3, pause: 420},
      {text: ". Sau", pause: 650},
      {text: " những tổn thương cũ, ", pause: 900},
      {text: "sau những đổ vỡ không lời, ", pause: 900},
      {text: "anh dần học cách im lặng và tự khâu vá những vết đau mà chẳng ai thấy. ", pause: 3000},
 {text: "Có những đêm dài đến tận 2, 3 giờ sáng, ", pause: 3000},
 {text: "anh chỉ nằm đó, ", pause: 2200},
 {text: "nhìn trần nhà, ", pause: 1200},
 {text: "không buồn, ", pause: 900},
 {text: "không vui, ", pause: 1200},
 {text: "chỉ thấy trống rỗng", pause: 900},
 {text: "...", pause: 4200},
      {text: "\nVà rồi em đến !!!", pause: 4000},

    {text: "\n Đoạn này còn nữa nhưng đang code hehe! ", pause: 4000},

      {text: "\nLàm người yêu anh nhé ?", pause: 4000},
      {text: "\nĐể anh được yêu em, ", pause: 900},
      {text: "chở che em ", pause: 900},
      {text: "và nắm tay em đi hết quãng đời này ", pause: 1200},
      {text: "- ", pause: 800},
      {text: "bằng tất cả những gì chân thành nhất mà anh có ", pause: 1200},
      {text: "và ", pause: 2200},
      {text: "bằng cả trái tim đã sống lại ", pause: 900},
      {text: "- vì em ", pause: 900},
      {text: "😘😘😘", pause: 300},
      {delete: 6, pause: 200},
      {text: "💖", pause: 1200}

];

function startTyping(){
  if(!typeTarget) return;
  typeTarget.textContent = ''; // chắc chắn rỗng
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  typeTarget.appendChild(cursor);

  const charSpeed = 60, delSpeed = 30;
  let stepIndex = 0, charIndex = 0, currentText = '';

  function runStep(){
    if(stepIndex >= sequence.length) return;
    const step = sequence[stepIndex];

    if(step.text !== undefined){
      if(charIndex < step.text.length){
        currentText += step.text.charAt(charIndex++);
        renderText();
        setTimeout(runStep, charSpeed + (Math.random()*50 - 8));
      } else { charIndex = 0; stepIndex++; setTimeout(() => runStep(), step.pause||220); }
    } else if(step.delete !== undefined){
      if(step.delete > 0){
        currentText = currentText.slice(0, -1); step.delete--;
        renderText();
        setTimeout(runStep, delSpeed + (Math.random()*12 - 6));
      } else { stepIndex++; setTimeout(() => runStep(), step.pause||120); }
    } else { stepIndex++; setTimeout(() => runStep(), 120); }
  }

  function renderText(){
    typeTarget.textContent = currentText;
    typeTarget.appendChild(cursor);
  }

  runStep();
}</script>



</body>
</html>
