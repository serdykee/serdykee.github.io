<style>  
/* =========================================
      1. CẤU HÌNH MÀU SẮC & BIẾN (VARIABLES)
   ========================================= */
:root{
--glass-bg: rgba(255,255,255,.05);   
--glass-brd: rgba(255,255,255,.35);  
--text: #f6f7fb;                     
--shadow: rgba(0,0,0,.25);           
--blur: 3px;                         
}

*{box-sizing:border-box}

html, body {
height: 100%; 
margin: 0;
display: flex; 
justify-content: center; 
align-items: center;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
color: var(--text); 
letter-spacing: .1px;
/* Background dạng gradient tối màu */
background: radial-gradient(1200px 800px at 10% 10%, #2a2a72 0%, #1f1c2c 35%, #111 100%) fixed;
}


/* =========================================
      2. HIỆU ỨNG TRÁI TIM BAY (ĐÃ SỬA Z-INDEX)
      ========================================= */
.hearts{ position:fixed; inset:0; pointer-events:none; z-index: 1; }

.hearts i{ position:absolute; width:16px; height:16px; transform: rotate(45deg);
background: linear-gradient(135deg, #ff6b9f, #ffd1dc);
filter: drop-shadow(0 4px 10px rgba(255,107,159,.35));
opacity:.12; animation: floatUp var(--dur) linear infinite;
}
.hearts i:before,.hearts i:after{ content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:inherit; }
.hearts i:before{ left:-8px; }
.hearts i:after{ top:-8px; }

@keyframes floatUp{ 
0%{ transform:translateY(10vh) rotate(45deg) scale(.8);} 
100%{ transform:translateY(-110vh) rotate(45deg) scale(1.1);} 
}

/* =========================================
      2. HIỆU ỨNG SAO RƠI
      ========================================= */
.stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.star {
position: absolute; top: 50%; left: 50%;
height: 2px; background: linear-gradient(-45deg, #5f91ff, rgba(0,0,255,0));
filter: drop-shadow(0 0 6px #699bff);
animation: tail 3000ms ease-in-out infinite, shooting 3000ms ease-in-out infinite;
}
@keyframes tail { 0% { width: 0; } 30% { width: 100px; } 100% { width: 0; } }

@keyframes shooting { 
0% { 
transform: translate(0, 0) rotate(45deg); 
} 
100% { 
/* Rơi chéo xuống 300px theo cả X và Y */
transform: translate(500px, 500px) rotate(45deg); 
} 
}

/* =========================================
      3. KHUNG CHỨA NỘI DUNG (ĐÃ SỬA Z-INDEX)
	========================================= */
.serdykee{
width: min(1200px, 90vw); 
height: 95px;              /* 👈 CHỈ CAO ĐỦ CHỨA TIÊU ĐỀ */
padding: 28px;
border-radius: 55px;
animation: glowPulse 4s ease-in-out infinite;              /* 👈 VIỀN SÁNG */
background: var(--glass-bg);
border: 1px solid var(--glass-brd);
backdrop-filter: blur(var(--blur)) saturate(140%);
-webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
box-shadow: 0 20px 50px var(--shadow);
overflow: hidden;
transition: height 2s ease;  /* 👈 CHO PHÉP XỔ MƯỢT */
  position: relative;
  display: inline-block;
}
.serdykee.open{
height: 520px;   /* 👈 chiều cao khi xổ */
}
.serdykee.open .typing{
opacity: 1;
pointer-events: auto;
scroll-padding-top: 2em;
}
@keyframes glowPulse {
0% {box-shadow: 0 0 0px rgba(255,255,255,0.0); border-color: rgba(255,255,255,0.35);}
50% {box-shadow: 0 0 18px rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.8);}
100% {box-shadow: 0 0 0px rgba(255,255,255,0.0); border-color: rgba(255,255,255,0.35);}
}

@keyframes rise{ from{ transform: translateY(16px); opacity:0 } to{ transform: translateY(0); opacity:1 } }

/* Hiệu ứng lóe sáng */
.serdykee::after {
  content: '';
  position: absolute;
  top: 0; left: -50%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
  transform: skewX(-25deg);
  animation: shine 2s infinite;
}
@keyframes shine {
  0% { left: -100%; }
  50% { left: 150%; }
  100% { left: 250%; }
}
	




h1 {
	    text-align: center;
		margin: 3px 0 0px;
		font-weight: 800;
		font-size: clamp(24px, 5vw, 34px);
		line-height: 1.2;
		background: linear-gradient(150deg, #edf37d, #7877eb, #f10505);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
		text-shadow: 5px 5px 3px rgba(223, 237, 0, 11%);
}

/* =========================================
      4. HIỆU ỨNG GÕ CHỮ
      ========================================= */
.typing{  
white-space: pre-wrap; 
font-size: clamp(16px, 3.6vw, 18px); 
line-height: 1.6; 
color: #f2f6ff; 
text-align: justify;
//margin-top: 12px;
//padding-top: 0.8em;
opacity: 0;              /* 👈 ẨN */
pointer-events: none;
transition: opacity 1s ease;

height: 330px;                 /* 🔒 CỐ ĐỊNH TỪ ĐẦU */
overflow-y: auto;              /* LUÔN CUỘN */
scroll-behavior: smooth;       /* ✨ MƯỢT */
-webkit-overflow-scrolling: touch; /* 📱 MƯỢT TRÊN MOBILE */

scrollbar-width: none;
}
.typing::-webkit-scrollbar{
display:none;
}




.cursor {
display: inline-block;
width: 10px;          
line-height: 1em;
height: 1.2em;        
margin-left: 1px;
vertical-align: text-bottom;
border-left: 2px solid currentColor;
animation: blink 1s steps(1) infinite;
}
@keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* =========================================
      5. BUTTONS
      ========================================= */
.actions{  
      display: none; 
      gap: 10px; margin-top: 18px; 
      align-items: center; flex-wrap: wrap; justify-content: center;
      opacity: 0;
  display: none;
  opacity: 0;
  margin-top: 0;
  padding: 0;
  height: 0;
  overflow: hidden;
}

.actions.show{
      display: flex;
      animation: fadeUp 1s ease forwards;
  display: flex;
  gap: 10px;
  margin-top: 18px;
  height: auto;
  opacity: 1;
  animation: fadeUp 1s ease forwards;
}
@keyframes fadeUp {
from { opacity:0; transform: translateY(40px); }
to  { opacity:1; transform: translateY(0); }
}

.btn{
padding: 10px 16px; border-radius: 55px; border: 1px solid rgba(255,255,255,.35);
background: linear-gradient(180deg, rgb(221 227 239 / 9%), rgb(255 72 1 / 22%));
color: var(--text); font-weight: 700; letter-spacing: .3px; cursor: pointer;
backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
transition: transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.note{ 
    text-align: center;
display: none;
  margin-top: 5px;
  padding: 10px 14px;
  opacity: 0;
  transform: translateY(15px);
  transition: opacity 1.2s ease, transform 1.2s ease; /* 👈 Tăng lên 1.2s */
  transition: all .5s ease;
		font-weight: 750;
		letter-spacing: -0.9px;;
		transform-origin: center; 
}
.note.show {
    display: block;
    opacity: 1;
	transform: translateY(0); /* 👈 Trôi lên vị trí ban đầu (hoặc -5px nếu muốn trôi cao hơn) */
    position: relative;
    /* Rainbow gradient chạy ngang */
    background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet, red);
    background-size: 200%;  /* để gradient đủ dài chạy */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    /* Viền sáng */
    text-shadow: 0 0 5px #fff, 0 0 10px #fff;
    /* Animation tổng hợp */
    animation: rainbowMove 3s linear infinite, glow 1.5s ease-in-out infinite, float 3s ease-in-out infinite;
	animation-delay: 1.2s; /* 👈 QUAN TRỌNG NHẤT */
}
/* Rainbow gradient chạy sang phải */
@keyframes rainbowMove {
    0%   { background-position: 0%; }
    100% { background-position: 200%; }
}
/* Float trôi lên xuống */
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}
/* Glow viền chữ nhấp nháy */
@keyframes glow {
    0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff; }
    50% { text-shadow: 0 0 10px #fff, 0 0 20px #fff; }
}

/* ----------------------------------Header--------------------------------------- */
.display-badget{
    width: 165px;
    height: 160px;
		border-radius: 50%;
    display: block;
	position: relative;
	z-index: 11; 
	margin-bottom: -120px;
}
.display-image{
    width: 86px;
    height: 86px;
    display: block;
	border-radius: 50%;
	position: relative;
	border: 2px solid var(--glass-brd);
	z-index: 10; 
	margin-bottom: -20px;
animation: glowPulse 4s ease-in-out infinite;              /* 👈 VIỀN SÁNG */
}
.serdykee-wrap{
	 transform: translateY(-5%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5; /* trên sao & tim.. để đưa avt serdykee lên trên khung .serdykee */
}
/* ----------------------------------Footer--------------------------------------- */
.footer {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  text-align: center;
  padding: 10px 0;
  color: var(--text);
  z-index: 50; /* trên các hiệu ứng */
}
.footer-logo{
    background: url(https://vnxf.vn/attachments/bg4_zps012f7fcf-gif.2891/); 
	repeat scroll 0% 0% transparent;
  width: 60px;  
    height: auto;
	opacity: 0.65; /* mờ 80% */
	    transition: opacity .3s ease;
}
.heartbeat {
  color: #e74c3c;
  animation: heartbeat 1.5s infinite;
  font-size: 14px
}
@keyframes heartbeat {
  0% {
      transform: scale( .75 )
  }
  20% {
      transform: scale( 1 )
  }
  40% {
      transform: scale( .75 )
  }

  60% {
      transform: scale( 1 )
  }
  80% {
      transform: scale( .75 )
  }
  100% {
      transform: scale( .75 )
  }
}
.fa {
  display: inline-block;
  font: normal normal normal 15px/1 FontAwesome;
  font-size: inherit;
  text-rendering: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale
}
.fa-heart:before {
  content: "❤"
}
.copyright {
  font-family: Arial;
  color: #ffffff63;
  font-size: 12px; /* KHÔNG dùng clamp */
  line-height: 1.4;
  margin-top: 5px;
  text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.3);
  white-space: nowrap;
}

/* =========================================
   BOTGET Ở CHÂN KHUNG KHI SERDYKEE MỞ
   ========================================= */
.serdykee::before {
  content: "";
  position: absolute;
  bottom: -42px;              /* 👈 thò ra ngoài chân khung */
  left: 50%;
  transform: translateX(-50%) scale(0.6);
  width: 150px;               /* chỉnh theo size botget.png */
  height: 120px;
  background: url("./image/botget.png") no-repeat center / contain;
  opacity: 0;
  z-index: 30;
  pointer-events: none;
  transition: 
    opacity 1.8s ease,
    transform 2.2s ease;
}

/* Khi mở thư */
.serdykee.open::before {
  opacity: 1;
  transform: translateX(-50%) scale(1);
  
/* Ẩn botget khi chọn */
.serdykee.hide-botget::before {
  opacity: 0;
  transform: translateX(-50%) scale(.7);
}


</style>
</head>

<body>
<audio id="bgMusic" loop><source src="./audio/nhacnen.mp3" type="audio/mpeg"></audio>
<audio id="yesMusic"><source src="./audio/yes.mp3" type="audio/mpeg"></audio>
<audio id="noMusic"><source src="./audio/no.mp3" type="audio/mpeg"></audio>
	
<div class="hearts" aria-hidden="true"></div>
<div class="stars"></div>

<div class="serdykee-wrap">
        <img id="displaybadget"
         class="display-badget"
         src="./image/badget.png"
         alt="SerdyKee">
		 
		<img id="displayImage"
         class="display-image"
         src="./image/serdykee.jpg"
         alt="SerdyKee">
		 
<section class="serdykee">
<h1 id="openLetter" style="cursor:pointer">Gửi người anh thương…❤️</h1>

<p id="typeTarget" class="typing"><span id="typedText"></span><span class="cursor"></span></p>

<div class="actions" id="actions">
<button class="btn" id="btnYes">💖 ĐỒNG Ý</button>
<button class="btn" id="btnNo">💔 KHÔNG ĐỒNG Ý</button>
</div>

<div class="note" id="note"></div>
</section>
</div>
<script>
// -----------------------------------------------------
// 1. TẠO HIỆU ỨNG TRÁI TIM BAY
// -----------------------------------------------------
(function seedHearts(){
const ctn = document.querySelector('.hearts');
const N = 30; 
for(let i=0;i<N;i++){
const h = document.createElement('i');
h.style.left = Math.random()*100 + 'vw';
h.style.bottom = (-10 + Math.random()*20) + 'vh';
h.style.setProperty('--dur', (18+Math.random()*14)+'s');
h.style.animationDelay = (Math.random()*-20)+'s';
// SỬA: Chỉnh lại size của i để phù hợp với CSS trái tim
h.style.setProperty('--size', (12 + Math.random()*12) + 'px');
ctn.appendChild(h);
}
})();

// -----------------------------------------------------
// 2. NỘI DUNG THƯ
// -----------------------------------------------------
const sequence = [
{text: "....... yêu dấu !", pause: 2200},
      {text: "\nAnh vốn dĩ không phải là một người hoàn hỏaoo...", pause: 700},
      {delete: 8, pause: 500},
      {text: "hảo,", pause: 1250},
      {text: " anh vẫn đầy những khuyết điểm và những thiếu soots !", pause: 1200},
	{delete: 7, pause: 200},
      {text: "sót, ", pause: 500},
      {text: "chẳng phải lúc nào cũng dịu dàng trước em.", pause: 4200},

      {text: " Mỗi một ngày anh đều cố gắng dành cho em thứ tình yêu mà em xứng đáng được nhận, cho em thứ cảm giác an toàn nhiều hơn, cùng nhau trải qua những ngày tồi tệ, để tìm được những ngày bình yên, như lúc này.", pause: 4200},



      {text: "\nAnh từng nghĩ mình sẽ", pause: 1200},
	{delete: 7, pause: 300},
      {text: "trái tim mình sẽ chẳng thể rung động lại nữa...", pause: 2200},
      {delete: 3, pause: 420},
      {text: ". Sau", pause: 650},
      {text: " những tổn thương cũ, ", pause: 900},
      {text: "sau những đổ vỡ không lời, ", pause: 900},
      {text: "anh dần học cách im lặng và tự khâu vá những vết đau mà chẳng ai thấy. ", pause: 3000},
 {text: "Có những đêm dài đến tận 2, 3 giờ sáng, ", pause: 3000},
 {text: "anh chỉ nằm đó, ", pause: 2200},
 {text: "nhìn trần nhà, ", pause: 1200},
 {text: "không buồn, ", pause: 900},
 {text: "không vui, ", pause: 1200},
 {text: "chỉ thấy trống rỗng", pause: 900},
 {text: "...", pause: 4200},
      {text: "\nVà rồi em đến !!!", pause: 4000},


      {text: "\nLàm người yêu anh nhé ?", pause: 4000},
      {text: "\nĐể anh được yêu em, ", pause: 900},
      {text: "chở che em ", pause: 900},
      {text: "và nắm tay em đi hết quãng đời này ", pause: 1200},
      {text: "- ", pause: 800},
      {text: "bằng tất cả những gì chân thành nhất mà anh có ", pause: 1200},
      {text: "và ", pause: 2200},
      {text: "bằng cả trái tim đã sống lại ", pause: 900},
      {text: "- vì em ", pause: 900},
      {text: "😘😘😘", pause: 300},
      {delete: 6, pause: 200},
      {text: "💖", pause: 1200}
    ];

// -----------------------------------------------------
// 3. HIỆU ỨNG BẨM XỔ RA
// -----------------------------------------------------
const bgMusic = document.getElementById('bgMusic');
let started = false;

function openSerdykee() {
  if (started) return;
  started = true;

const card = document.querySelector('.serdykee');
card.classList.add('open');

// 🎵 TỰ PHÁT NHẠC NỀN KHI MỞ THƯ
  if (bgMusic) {
    bgMusic.currentTime = 0;
    bgMusic.volume = 0.2;
    bgMusic.play().catch(e => console.log(e));
  }

setTimeout(() => {
runStep(); // ✍️ bắt đầu gõ chữ
}, 3200);
}
document.getElementById('openLetter')
  .addEventListener('click', openSerdykee);

document.getElementById('displaybadget')
  .addEventListener('click', openSerdykee);



// -----------------------------------------------------
// 3. XỬ LÝ LOGIC GÕ CHỮ, CUỘN TỰ ĐỘNG
// -----------------------------------------------------
const el = document.getElementById('typeTarget');
const textEl = document.getElementById('typedText');
const charSpeed = 50, delSpeed = 25;  
let stepIndex = 0, charIndex = 0, currentText = '';
function runStep(){
if(stepIndex >= sequence.length){
// Khi kết thúc gõ chữ
document.getElementById('actions').classList.add('show');
// Kích hoạt class scrollable và cuộn về cuối
el.classList.add('scrollable');
el.scrollTop = el.scrollHeight - 10; 
return;
}
const step = sequence[stepIndex];
if(step.text !== undefined){
if(charIndex < step.text.length){
currentText += step.text.charAt(charIndex++);
renderText();
// === LOGIC CUỘN MỀM MẠI KHI GÕ ===
// Cuộn xuống 9999px nếu nội dung tràn ra khỏi khung
if (el.scrollHeight > el.clientHeight) {
el.scrollTop = el.scrollHeight; 
}
// ===================================
setTimeout(runStep, charSpeed + (Math.random()*18 - 8));
} else {  
charIndex = 0;  
stepIndex++;  
setTimeout(runStep, step.pause||220);  
}
} 
else if(step.delete !== undefined){
if(step.delete > 0){
currentText = currentText.slice(0, -1);  
step.delete--;
renderText();
setTimeout(runStep, delSpeed + (Math.random()*12 - 6));
} else {  
stepIndex++;  
setTimeout(runStep, step.pause||120);  
}
} else {  
stepIndex++;  
setTimeout(runStep,120);  
}
}
// Cuộn mượt, KHÔNG nhảy
function renderText(){
textEl.textContent = currentText;
el.scrollTop = el.scrollHeight; // 🚀 CUỘN NGAY – RẤT NHANH
}
	// ------------------------------------------------------------------
	// Hàm Rung Ngắn 2 Lần (Rung: 80ms, Nghỉ: 50ms, Rung: 80ms)
	// ------------------------------------------------------------------
function vibrateDeny() {
    // Kiểm tra tính năng Vibration API
    if (navigator.vibrate) {
        navigator.vibrate([80, 50, 80]); 
    }
}
	// ------------------------------------------------------------------
	// 4. XỬ LÝ SỰ KIỆN NÚT BẤM & NHẠC CHUẨN MOBILE
	// ------------------------------------------------------------------
	const actions = document.getElementById('actions');
	const note = document.getElementById('note');
	bgMusic.volume = 0.2; 	// Nhạc nền dịu

	// ============ NÚT ĐỒNG Ý ============
	document.getElementById('btnYes').addEventListener('click', () => {
		  // 🔴 Ẩn botget TRƯỚC
  document.querySelector('.serdykee').classList.add('hide-botget');
	// 1. Dừng nhạc nền hoàn toàn
    if(bgMusic && !bgMusic.paused){bgMusic.pause(); bgMusic.currentTime = 0;}
    // 3. Phát nhạc hiệu ứng YES
    const yesEffect = new Audio('./audio/yes.mp3'); yesEffect.volume = 1; yesEffect.play().catch(e => console.log(e));
    // 4. Hiển thị note
    note.innerHTML = '💖 Anh đang chờ hồi âm của em đấy !';
    note.classList.add('show');
    // 5. Thay nút bằng nút Chat
    actions.innerHTML = `<button class="btn" id="btnYes">💘 NHẮN TIN CHO ANH NHÉ !</button>`;
    document.getElementById('btnYes').addEventListener('click', () => {
    window.open('https://serdykee.github.io', '_blank'); // gắn link chat
    });
});

	// ========== NÚT KHÔNG ĐỒNG Ý ==========
	document.getElementById('btnNo').addEventListener('click', () => {
		  // 🔴 Ẩn botget TRƯỚC
  document.querySelector('.serdykee').classList.add('hide-botget');
    // 1. Dừng nhạc nền hoàn toàn
	if(bgMusic && !bgMusic.paused){bgMusic.pause(); bgMusic.currentTime = 0;}
    // 2. Phát nhạc hiệu ứng NO
    const noEffect = new Audio('./audio/no.mp3'); noEffect.volume = 1; noEffect.play().catch(e => console.log(e));
	
	// === BỔ SUNG: GỌI HÀM RUNG 2 LẦN NGẮN VÀO ĐÂY ===
    vibrateDeny(); 
    // ===============================================
	
	
    // 4. Hiển thị note
    note.innerHTML = '🌙 Anh sẽ tôn trọng quyết định của em !';
    note.classList.add('show');
    // 5. Thay nút bằng nút Bye
actions.innerHTML = '';
    const btnBye = document.createElement('button');

(function seedStars() {
const ctn = document.querySelector('.stars');
const N = 15;                                          // Số lượng sao băng bạn muốn
for (let i = 0; i < N; i++) {
const star = document.createElement('div');
star.className = 'star';
const randomX = Math.random() * 100 + 'vw';             // Thiết lập vị trí, kích thước, và thời gian animation ngẫu nhiên
const randomY = Math.random() * 100 + 'vh';
const randomDuration = 3 + Math.random() * 5 + 's';     // 3s đến 8s
const randomDelay = Math.random() * -10 + 's';          // Delay âm để các ngôi sao xuất hiện ngay
star.style.left = randomX;
star.style.top = randomY;
star.style.animationDuration = randomDuration;
star.style.animationDelay = randomDelay;
star.style.width = 1 + Math.random() * 2 + 'px';        // Kích thước của đuôi sao
ctn.appendChild(star);
}
})();
