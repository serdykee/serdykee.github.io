<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💌 Tâm thư gửi em !</title>
  <meta name="description" content="Chú cừu SerdyKee và bầy sói !" />

  <style>  
    /* =========================================
       1. CẤU HÌNH MÀU SẮC & BIẾN (VARIABLES)
       ========================================= */
    :root{
      --glass-bg: rgba(255,255,255,.05);   
      --glass-brd: rgba(255,255,255,.35);  
      --text: #f6f7fb;                     
      --shadow: rgba(0,0,0,.25);           
      --blur: 3px;                         
    }

    *{box-sizing:border-box}

    html, body {
      height: 100%; 
      margin: 0;
      display: flex; 
      justify-content: center; 
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); 
      letter-spacing: .2px;
      /* Background dạng gradient tối màu */
      background: radial-gradient(1200px 800px at 10% 10%, #2a2a72 0%, #1f1c2c 35%, #111 100%) fixed;
    }




.music-control {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 100;
    width: 60px;
    height: 60px;
    border-radius: 50%; /* Dùng 50% thay vì 100% cho chuẩn */
    font-size: 24px; /* Tăng kích thước icon nhạc */
    
    /* === CẢI THIỆN HIỆU ỨNG TRONG SUỐT === */
    background: rgba(255, 255, 255, 0.1); /* Tăng nhẹ độ trong suốt */
    backdrop-filter: blur(10px) saturate(180%); /* Tăng độ mờ và độ bão hòa */
    -webkit-backdrop-filter: blur(10px) saturate(180%); /* Hỗ trợ trình duyệt */
    
    display: flex; 
    justify-content: center; 
    align-items: center;
    cursor: pointer; 
    
    /* Viền trắng sáng hơn, mỏng hơn, có độ bóng nhẹ */
    border: 1px solid rgba(255, 255, 255, 0.6); 
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), 
                inset 0 0 0 1px rgba(255, 255, 255, 0.05); /* Bóng bên trong nhẹ */

    transition: all 0.3s ease;
    animation: spin 8s linear infinite; 
    animation-play-state: paused;
}

/* Hiệu ứng khi đang phát nhạc (Thêm Glow) */
.music-control.playing { 
    animation-play-state: running; 
    background: rgba(255, 107, 159, 0.5); /* Nền hồng mờ */
    border-color: rgba(255, 107, 159, 0.8);
    /* Tỏa sáng hồng lãng mạn */
    box-shadow: 0 0 15px rgba(255, 107, 159, 0.8),
                0 0 25px rgba(255, 192, 203, 0.6);
}

@keyframes spin { 
    100% { transform: rotate(360deg); } 
}



    /* =========================================
       2. HIỆU ỨNG TRÁI TIM BAY (ĐÃ SỬA Z-INDEX)
       ========================================= */
    /* SỬA: Đổi z-index từ -1 thành 1 để hiện lên trên background */
    .hearts{ position:fixed; inset:0; pointer-events:none; z-index: 1; }
    
    .hearts i{ position:absolute; width:16px; height:16px; transform: rotate(45deg);
      background: linear-gradient(135deg, #ff6b9f, #ffd1dc);
      filter: drop-shadow(0 4px 10px rgba(255,107,159,.35));
      opacity:.12; animation: floatUp var(--dur) linear infinite;
    }
    .hearts i:before,.hearts i:after{ content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:inherit; }
    .hearts i:before{ left:-8px; }
    .hearts i:after{ top:-8px; }

    @keyframes floatUp{ 
      0%{ transform:translateY(10vh) rotate(45deg) scale(.8);} 
      100%{ transform:translateY(-110vh) rotate(45deg) scale(1.1);} 
    }
	
    /* =========================================
       2. HIỆU ỨNG SAO RƠI
       ========================================= */
.stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.star {
    position: absolute; top: 50%; left: 50%;
    height: 2px; background: linear-gradient(-45deg, #5f91ff, rgba(0,0,255,0));
    filter: drop-shadow(0 0 6px #699bff);
    animation: tail 3000ms ease-in-out infinite, shooting 3000ms ease-in-out infinite;
}
@keyframes tail { 0% { width: 0; } 30% { width: 100px; } 100% { width: 0; } }
@keyframes shooting { 0% { transform: translateX(0); } 100% { transform: translateX(300px); } }





    /* =========================================
       3. KHUNG CHỨA NỘI DUNG (ĐÃ SỬA Z-INDEX)
       ========================================= */
    .serdykee{
      width: min(1200px, 90vw); 
      min-height: 260px;
      padding: 28px;
      border-radius: 22px;
      
      background: var(--glass-bg);
      border: 1px solid var(--glass-brd);
      backdrop-filter: blur(var(--blur)) saturate(140%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
      box-shadow: 0 20px 50px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.02);
      
      position: relative; 
      overflow: hidden;
      /* SỬA: Thêm z-index cao hơn trái tim để chữ luôn nằm đè lên tim */
      z-index: 10; 
      
      animation: rise .9s ease-out both, glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0% {box-shadow: 0 0 0px rgba(255,255,255,0.0); border-color: rgba(255,255,255,0.35);}
      50% {box-shadow: 0 0 18px rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.8);}
      100% {box-shadow: 0 0 0px rgba(255,255,255,0.0); border-color: rgba(255,255,255,0.35);}
    }

    @keyframes rise{ from{ transform: translateY(16px); opacity:0 } to{ transform: translateY(0); opacity:1 } }

    h1 {
      margin: 4px 0 12px;
      font-weight: 800;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.2;
      background: linear-gradient(90deg, #fff, #dff8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow: 0 2px 12px rgba(0, 150, 255, .25);
    }

    /* =========================================
       4. HIỆU ỨNG GÕ CHỮ
       ========================================= */
    .typing{ 
      white-space: pre-wrap; 
      font-size: clamp(16px, 3.6vw, 18px); 
      line-height: 1.6; 
      min-height: 4.4em; 
      color: #f2f6ff; 
      text-align: justify; 
    }
    
    .cursor {
      display: inline-block;
      width: 10px;               
      line-height: 1em;
      height: 1.2em;             
      margin-left: 1px;
      vertical-align: text-bottom; 
      border-left: 2px solid currentColor;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

    /* =========================================
       5. BUTTONS
       ========================================= */
    .actions{ 
      display: none; 
      gap: 10px; margin-top: 18px; 
      align-items: center; flex-wrap: wrap; justify-content: center;
      opacity: 0;
    }
    
    .actions.show{
      display: flex;
      animation: fadeUp 1s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(40px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .btn{
      padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.35);
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      color: var(--text); font-weight: 700; letter-spacing: .3px; cursor: pointer;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 24px rgba(0,0,0,.3);
      transition: transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,.35); border-color: rgba(255,255,255,.6); }
    
    .btn.primary{ color: #0a0d0f; background: linear-gradient(180deg, #7cf7d4, #48e4bd); border-color: transparent; }
    .btn.heart{ background: linear-gradient(180deg, #ff9ac0, #ff6b9f); border-color: transparent }
    .note{ margin-top: 10px; font-size: 12px; opacity: .75 }
  </style>
</head>
<body>
<audio id="bgMusic" loop>
  <source src="/audio/khongthoigian.mp3" type="audio/mpeg">
</audio>

<div class="music-control" onclick="toggleMusic()">🎵</div>
  <div class="hearts" aria-hidden="true"></div>
  <div class="stars"></div>
  <section class="serdykee">
   <h1>Gửi người anh thương…</h1>
   
   <p id="typeTarget" class="typing"></p>

    <div class="actions" id="actions">
      <button class="btn heart" id="btnYes">💖 ĐỒNG Ý</button>
      <button class="btn" id="btnNo">🌙 KHÔNG ĐỒNG Ý</button>
    </div>
    
    <div class="note" id="note"></div>
  </section>

  <script>
    // -----------------------------------------------------
    // 1. TẠO HIỆU ỨNG TRÁI TIM BAY
    // -----------------------------------------------------
    (function seedHearts(){
      const ctn = document.querySelector('.hearts');
      const N = 30; 
      for(let i=0;i<N;i++){
        const h = document.createElement('i');
        h.style.left = Math.random()*100 + 'vw';
        h.style.bottom = (-10 + Math.random()*20) + 'vh';
        h.style.setProperty('--dur', (18+Math.random()*14)+'s');
        h.style.animationDelay = (Math.random()*-20)+'s';
        h.style.fontSize = (12 + Math.random()*50) + 'px';      
        ctn.appendChild(h);
      }
    })();

    // -----------------------------------------------------
    // 2. NỘI DUNG THƯ
    // -----------------------------------------------------
    const sequence = [
      {text: "Ngọc Hà yêu dấu !", pause: 2200},
      {text: "\nAnh vốn dĩ không phải là một người hoàn hỏaoo...", pause: 700},{delete: 8, pause: 500},
      {text: "hảo,", pause: 1250},
      {text: " anh vẫn đầy những khuyết điểm và những thiếu soots !", pause: 1200},{delete: 7, pause: 200},
      {text: "sót, ", pause: 500},
      {text: "chẳng phải lúc nào cũng dịu dàng trước em. ", pause: 4200},
      {text: "Mỗi một ngày anh đều cố gắng dành cho em thứ tình yêu mà em xứng đáng được nhận, cho em thứ cảm giác an toàn nhiều hơn, cùng nhau trải qua những ngày tồi tệ, để tìm được những ngày bình yên, như lúc này. ", pause: 4200},
      {text: "\nAnh từng nghĩ mình sẽ", pause: 1200},
      {delete: 7, pause: 300},
      {text: "trái tim mình sẽ chẳng thể rung động lại nữa...", pause: 2200},
      {delete: 3, pause: 420},
      {text: ". Sau", pause: 650},
      {text: " những tổn thương cũ, ", pause: 900},
      {text: "sau những đổ vỡ không lời, ", pause: 900},
      {text: "anh dần học cách im lặng và tự khâu vá những vết đau mà chẳng ai thấy. ", pause: 3000},
      {text: "Có những đêm dài đến tận 2, 3 giờ sáng, ", pause: 3000},
      {text: "anh chỉ nằm đó, ", pause: 2200},
      {text: "nhìn trần nhà, ", pause: 1200},
      {text: "không buồn, ", pause: 900},
      {text: "không vui, ", pause: 1200},
      {text: "chỉ thấy trống rỗng", pause: 900},
      {text: "...", pause: 4200},
      {text: "\nVà rồi em đến !!!", pause: 4000},
      
      {text: "\nĐoạn này còn nữa nhưng đang code hehe! ", pause: 4000},
      {text: "\n............ ", pause: 4000},
      
      {text: "\nLàm người yêu anh nhé ?", pause: 4000},
      {text: "\nĐể anh được yêu em, ", pause: 900},
      {text: "chở che em ", pause: 900},
      {text: "và nắm tay em đi hết quãng đời này ", pause: 1200},
      {text: "- ", pause: 800},
      {text: "bằng tất cả những gì chân thành nhất mà anh có ", pause: 1200},
      {text: "và ", pause: 2200},
      {text: "bằng cả trái tim đã sống lại ", pause: 900},
      {text: "- vì em ", pause: 900},
      {text: "😘😘😘", pause: 300},
      {delete: 6, pause: 200},
      {text: "💖", pause: 1200}
    ];

    // -----------------------------------------------------
    // 3. XỬ LÝ LOGIC GÕ CHỮ
    // -----------------------------------------------------
    const el = document.getElementById('typeTarget');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);

    const charSpeed = 50, delSpeed = 25; 
    let stepIndex = 0, charIndex = 0, currentText = '';

    function runStep(){
      if(stepIndex >= sequence.length){
        document.getElementById('actions').classList.add('show');
        return;
      }
      const step = sequence[stepIndex];
      
      if(step.text !== undefined){
        if(charIndex < step.text.length){
          currentText += step.text.charAt(charIndex++);
          renderText();
          setTimeout(runStep, charSpeed + (Math.random()*18 - 8));
        } else { 
          charIndex = 0; 
          stepIndex++; 
          setTimeout(runStep, step.pause||220); 
        }
      } 
      else if(step.delete !== undefined){
        if(step.delete > 0){
          currentText = currentText.slice(0, -1); 
          step.delete--;
          renderText();
          setTimeout(runStep, delSpeed + (Math.random()*12 - 6));
        } else { 
          stepIndex++; 
          setTimeout(runStep, step.pause||120); 
        }
      } else { 
        stepIndex++; 
        setTimeout(runStep,120); 
      }
    }
    
    function renderText(){ el.textContent = currentText; el.appendChild(cursor); }
    
    setTimeout(runStep, 420);

    // -----------------------------------------------------
    // 4. XỬ LÝ SỰ KIỆN NÚT BẤM
    // -----------------------------------------------------

const note = document.getElementById('note');
// Lấy các thẻ audio
const bgMusic = document.getElementById('bgMusic');
const effectMusic = document.getElementById('effectMusic');
const musicBtn = document.querySelector('.music-control');
const vinyl = document.querySelector('.vinyl-record');

// Nút Đồng ý
document.getElementById('btnYes').addEventListener('click', ()=>{ 
    
    // 1. DỪNG NHẠC NỀN
    if (!bgMusic.paused) {
        bgMusic.pause();
        // Cập nhật trạng thái nút và đĩa than
        musicBtn.classList.remove('playing');
        if(vinyl) vinyl.style.animationPlayState = 'paused';
    }

    // 2. PHÁT NHẠC HIỆU ỨNG
    // Đặt lại thời gian về 0 để đảm bảo nhạc luôn phát từ đầu
    effectMusic.currentTime = 0; 
    effectMusic.play().catch(e => console.log('Lỗi phát nhạc hiệu ứng:', e));

    // 3. HIỂN THỊ THÔNG BÁO VÀ HIỆU ỨNG
    sparkle(); // Bắn pháo bông nhỏ
    note.innerHTML='Yay! 💫 Anh đang chờ đợi câu trả lời của em đấy. Còn chờ gì nữa mà không nhắn tin cho anh !';
});

// Nút Suy nghĩ thêm
document.getElementById('btnNo').addEventListener('click', ()=>{ 
    note.innerHTML='Không sao đâu ! Anh sẽ chờ em ⏳';
});
    // -----------------------------------------------------
    // 5. HIỆU ỨNG SPARKLE (Thêm lại hàm này để nút bấm đẹp hơn)
    // -----------------------------------------------------
    function sparkle(){
      const card = document.querySelector('.serdykee');
      for(let i=0;i<18;i++){
        const s = document.createElement('span');
        const size = 3 + Math.random()*4;
        
        s.style.position='absolute';
        s.style.left=(50+(Math.random()*40-20))+'%';
        s.style.top=(54+(Math.random()*14-7))+'%';
        s.style.width=s.style.height=size+'px';
        s.style.borderRadius='50%';
        s.style.background=Math.random()>.5?'#ff9ac0':'#7cf7d4';
        s.style.filter='drop-shadow(0 0 10px rgba(255,255,255,.6))';
        s.style.opacity='0.95';
        s.style.transform='translate(-50%,-50%)';
        s.style.pointerEvents='none';
        s.style.zIndex = '20'; // Đảm bảo hạt nổ bay lên trên cùng
        
        const dx=(Math.random()*120-60), dy=(Math.random()*80-60);
        s.animate([
            { transform:'translate(-50%,-50%) scale(1)', opacity:.95 },
            { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.3)`, opacity:0 }
        ], { duration:900+Math.random()*400, easing:'cubic-bezier(.2,.6,.2,1)' });
        
        card.appendChild(s); 
        setTimeout(()=>s.remove(),1400); 
      }
    }
	
	// -----------------------------------------------------
    // 6. HIỆU ỨNG NHẠC
    // -----------------------------------------------------
	
	function toggleMusic(){
    const music = document.getElementById('bgMusic');
    const btn = document.querySelector('.music-control');
    if(music.paused){
        music.play();
        btn.classList.add('playing');
    }else{
        music.pause();
        btn.classList.remove('playing');
    }
}
  </script>
  <audio id="effectMusic">
  <source src="/audio/khongthoigian_yes.mp3" type="audio/mpeg">
</audio>
</body>
</html>
